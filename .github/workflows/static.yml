                                Aunque hay $10M de utilidad, el costo de oportunidad del capital es $12M.<br><br>
                                Los inversionistas podrían obtener mejores retornos invirtiendo ese capital en otro lugar.
                            </div>
                        </div>
                    </div>
                </div>

                <div class="highlight-box" style="margin-top: 25px;">
                    ⚠️ Utilidad Positiva ($10M) pero EVA Negativo (-$2M) = Destrucción de Valor
                </div>
            </div>
        </div>

